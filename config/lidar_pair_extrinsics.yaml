schema_version: 1
description: >
  Canonical static transform for the Heron horizontal/vertical VLP-16 pair.
  The transform is stored as target_from_source: parent frame lidar_h_link,
  child frame lidar_v_link. Calibration tools may update this file only after
  their quality gate passes, unless the operator explicitly forces an update.
lidar_pair:
  initial_guess_transform:
    parent: lidar_h_link
    child: lidar_v_link
    expected_mount_relation: x_aligned_y_up_z_aft
    translation_xyz_m: [0.18, 0.035, -0.0873]
    rotation_quat_xyzw: [0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    rotation_rpy_rad: [1.5707963267948966, 0.0, 0.0]
    matrix_row_major:
      - [1.0, 0.0, 0.0, 0.18]
      - [0.0, 0.0, -1.0, 0.035]
      - [0.0, 1.0, 0.0, -0.0873]
      - [0.0, 0.0, 0.0, 1.0]
  active_transform:
    parent: lidar_h_link
    child: lidar_v_link
    expected_mount_relation: x_aligned_y_up_z_aft
    translation_xyz_m: [0.18, 0.035, -0.0873]
    rotation_quat_xyzw: [0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    rotation_rpy_rad: [1.5707963267948966, 0.0, 0.0]
    matrix_row_major:
      - [1.0, 0.0, 0.0, 0.18]
      - [0.0, 0.0, -1.0, 0.035]
      - [0.0, 1.0, 0.0, -0.0873]
      - [0.0, 0.0, 0.0, 1.0]
  last_calibration:
    report_path: null
    bag_path: null
    applied_at_utc: null
    transform_key: initial_target_from_source
    quality_gate:
      apply_recommended: true
      reject_reasons: []
    icp:
      rmse_m: null
      correspondences: null
      iterations: null
    pairs_used: null
  quality_policy:
    seed_relation: x_aligned_y_up_z_aft
    max_translation_correction_norm_m: 0.25
    max_rotation_correction_angle_deg: 10.0
    max_icp_rmse_m: 0.25
  history: []

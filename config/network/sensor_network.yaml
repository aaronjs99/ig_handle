# IG Handle live sensor and host endpoints.
# Frame geometry and model specifications live under config/sensors/.

sensor_network:
  endpoints:
    camera_f1:
      label: Forge F1 camera
      host: 192.168.50.101
    camera_f2:
      label: Forge F2 camera
      host: 192.168.50.102
    camera_f3:
      label: Forge F3 camera
      host: 192.168.50.103
    camera_f4:
      label: Forge F4 camera
      host: 192.168.50.104
    lidar_h:
      label: Horizontal VLP-16 LiDAR
      host: 192.168.50.201
    lidar_v:
      label: Vertical VLP-16 LiDAR
      host: 192.168.50.202
    sonar:
      label: Imaging sonar
      host: 192.168.2.4
    imu:
      label: Xsens IMU
      device_path: /dev/sensors/imu
      device_id: 0368319D
    heron:
      label: Heron Base Computer
      host: 192.168.131.1
  ros:
    heron_local_ip: 192.168.131.10
    # Simulation owns a dedicated ROS master so it cannot join the physical
    # Heron/sensor graph on the conventional ROS port.
    local_master_uri: http://192.168.1.81:11312
    local_ros_ip: 192.168.1.81
  mocap:
    natnet_server_ip: 192.168.1.199
    natnet_client_ip: 192.168.1.8
    natnet_multicast_address: 239.255.42.99
    udp_bind_ip: 0.0.0.0
    datacollect_source_ip: 192.168.8.6
  local_interfaces:
    sensor_lan_ip: 192.168.50.10
    sonar_lan_ip: 192.168.2.10

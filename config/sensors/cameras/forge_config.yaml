# Forge IP67 1GigE camera config.
#
# See spinnaker_camera_driver/cfg/Spinnaker.cfg for parameter descriptions and default values.
# The named boat cameras are Forge FG-PGE-50S5C-C-IP units:
# F1/F2 face forward, F3/F4 face upward.
# F1/F4 are starboard mounts; F2/F3 are port mounts.
# The current field profile enables all four Forge cameras.

# Trigger parameters
#
# The integrated boat bringup defaults to free-run acquisition.
# Hardware trigger mode requires an active Line0 trigger source
# Without it, the ROS driver can connect but then starve waiting for NEW_BUFFER_DATA events.
enable_trigger: 'Off'
trigger_selector: 'FrameStart'
trigger_activation_mode: 'RisingEdge'
trigger_source: 'Line0'
trigger_overlap_mode: 'ReadOut'
line_source: 'ExposureActive'
line_selector: 'Line1'
line_mode: 'Output'

# Image parameters
#
# Keep the integrated boat profile below full native throughput.
# The Forge cameras are 5MP GigE devices.
# Four full-resolution streams can overload the link or driver during multi-sensor bringup.
# The centered 640x512 ROI is an uncalibrated conservative runtime profile until real camera-info files are captured.
acquisition_frame_rate_enable: true
acquisition_frame_rate: 10.0
exposure_auto: Continuous
auto_exposure_time_upper_limit: 10000.0
auto_exposure_lighting_mode: Normal
auto_gain: Continuous
image_format_roi_width: 640
image_format_roi_height: 512
image_format_x_offset: 904
image_format_y_offset: 768
image_format_x_binning: 1
image_format_y_binning: 1
image_format_x_decimation: 1
image_format_y_decimation: 1
image_format_x_reverse: false
image_format_y_reverse: false
image_format_color_coding: BayerRG8
isp_enable: false
auto_white_balance: Continuous

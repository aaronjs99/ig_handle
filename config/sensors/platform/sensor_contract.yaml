    "4":
      model: FLIR Forge
      label: Forge F1 camera
      family: camera
      expected_publisher: /F1/camera_nodelet_manager
      dashboard_kind: camera
      dashboard_mode: Live MJPEG
      role: front_right
      startup_order: 40
      default_requested: true
      reachability: network
      endpoint_key: camera_f1_ip
      driver_name: F1
      frame: F1_optical
      serial: "25110056"
      camera_info_url: file://package://ig_handle/config/sensors/cameras/25110056.yaml
      # Spinnaker enumerates every GigE interface before selecting this serial.
      # Allow that bounded discovery to finish before stale-topic supervision starts.
      startup_grace_sec: 60.0
      startup_delay_sec: 0.0
      topics:
        image_raw: /sensors/camera/f1/image_raw
        camera_info: /sensors/camera/f1/camera_info
      launch:
        file: package://ig_handle/launch/sensors/start_cam.launch
        args:
          camera_name:
            field: driver_name
          frame_id:
            field: frame
          camera_serial:
            field: serial
          camera_ip:
            endpoint: true
          camera_info_url:
            field: camera_info_url
          topic:
            field: topics.image_raw
          camera_info_topic:
            field: topics.camera_info
          startup_delay_sec:
            field: startup_delay_sec

    "5":
      model: FLIR Forge
      label: Forge F2 camera
      family: camera
      expected_publisher: /F2/camera_nodelet_manager
      dashboard_kind: camera
      dashboard_mode: Live MJPEG

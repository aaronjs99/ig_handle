# Canonical IG Handle sensor contract.
#
# Platform launchers should read this contract instead of copying sensor
# defaults, topics, frames, endpoints, calibration files, or startup policy.
sensor_contract:
  defaults:
    reachability_timeout_sec: 1.0
  platform_topics:
    pps_time: /sensors/pps/time
    camera_time: /sensors/camera/time
    timing_status: /sensors/timing/status # Non-authoritative MCU diagnostic state.
  deployment_bindings:
    state_input:
      sensor: "1"
      topic: topics.data
      frame: frame
    state_input_time:
      sensor: "1"
      topic: topics.time
    mapping_primary:
      sensor: "2"
      topic: topics.points
      frame: frame
    mapping_secondary:
      sensor: "3"
      topic: topics.points
      frame: frame
    inspection_front_right:
      sensor: "4"
      topic: topics.image_raw
      info_topic: topics.camera_info
      frame: frame
      role: role
    inspection_front_left:
      sensor: "5"
      topic: topics.image_raw
      info_topic: topics.camera_info
      frame: frame
      role: role
    inspection_top_left:
      sensor: "6"
      topic: topics.image_raw
      info_topic: topics.camera_info
      frame: frame
      role: role
    inspection_top_right:
      sensor: "7"
      topic: topics.image_raw
      info_topic: topics.camera_info
      frame: frame
      role: role
    ranging_raw:
      sensor: "8"
      topic: topics.echosounder_raw
      frame: interfaces.imagenex_dt100.frame
      profile_config: profile_config
      profile: profile
      min_range_m: min_range_m
      sim_max_range_m: sim_max_range_m
      extrinsic_revision: interfaces.imagenex_dt100.extrinsic_revision
    ranging_ping360_raw:
      sensor: "9"
      topic: topics.imaging_raw
      frame: interfaces.blue_robotics_ping360.frame
      extrinsic_revision: interfaces.blue_robotics_ping360.extrinsic_revision
    ranging_profile:
      sensor: "9"
      topic: topics.imaging_profile
      frame: interfaces.blue_robotics_ping360.frame
      extrinsic_revision: interfaces.blue_robotics_ping360.extrinsic_revision
    ranging_image:
      sensor: "9"
      topic: topics.imaging_image
      frame: interfaces.blue_robotics_ping360.frame
    ranging_diagnostics:
      sensor: "9"
      topic: topics.imaging_diagnostics
    ranging_cloud:
      sensor: "8"
      topic: topics.echosounder_cloud
      frame: interfaces.imagenex_dt100.frame
    ranging_sim_rays:
      sensor: "8"
      topic: topics.echosounder_sim_rays
      frame: interfaces.imagenex_dt100.frame
    ranging_ping360_sim_rays:
      sensor: "9"
      topic: topics.imaging_sim_rays
      frame: interfaces.blue_robotics_ping360.frame
    ranging_map_cloud:
      sensor: "8"
      topic: topics.echosounder_map_cloud
      frame: frame
      max_retained_points: map_cloud_max_retained_points
      voxel_resolution_m: map_cloud_voxel_resolution_m
      max_point_age_sec: map_cloud_max_point_age_sec
      publish_rate_hz: map_cloud_publish_rate_hz
      min_points_per_slice: map_cloud_min_points_per_slice
    ranging_latest_slice:
      sensor: "8"
      topic: topics.echosounder_latest_slice_map
      frame: frame
  deployment_binding_groups:
    inspection_streams:
      - inspection_top_left
      - inspection_front_left
      - inspection_top_right
      - inspection_front_right
  # Sensor ids are opaque inventory keys. They are not positions, counts, array
  # indexes, or a promise that ids are contiguous; consumers must iterate this
  # mapping or resolve deployment bindings above.
  # Every sensor_bringup-owned sensor must declare the exact ROS publisher that
  # belongs to its selected launch mode before it may be enabled. Optional,
  # mode-dependent sensors remain disabled and fail closed until that ownership
  # binding is commissioned; publisher uniqueness alone is not ownership proof.
  sensors:
    "1":
      model: Xsens MTi-30
      label: Xsens IMU
      family: imu
      lifecycle_owner: external_service
      expected_publisher: /sensors/imu/driver
      dashboard_kind: imu
      dashboard_mode: ROS telemetry
      startup_order: 10
      default_requested: true
      reachability: device
      device_path: /dev/sensors/imu
      device_identity_path: /dev/serial/by-id/usb-Xsens_MTi-30_AHRS_0368319D-if01-port0
      frame: imu_link
      topics:
        data: /sensors/imu/data
        time: /sensors/imu/time
      required_topics:
        # Keep the remap available when the driver or MCU publishes it, but do
        # not fail passive sensor checks when the unsynchronized time channel is absent.
        time: false
      launch:
        file: package://ig_handle/launch/sensors/start_imu.launch
        args:
          topic:
            field: topics.data
          time_topic:
            field: topics.time
          frame_id:
            field: frame
          port:
            field: device_path
          node_name:
            literal: driver
          node_namespace:
            literal: /sensors/imu

    "2":
      model: Velodyne VLP-16
      label: Horizontal VLP-16 LiDAR
      family: lidar
      expected_publisher: /sensors/lidar/hori/lidar_h_link_nodelet_manager
      dashboard_kind: pointcloud
      dashboard_mode: ROS point cloud
      startup_order: 20
      default_requested: true
      reachability: network
      endpoint_key: lidar_h_ip
      frame: lidar_h_link
      driver_name: hori
      port: 2368
      topics:
        points: /sensors/lidar/hori/points
      launch:
        file: package://ig_handle/launch/sensors/start_lidar.launch
        args:
          name:
            field: driver_name
          device_ip:
            endpoint: true
          port:
            field: port
          frame_id:
            field: frame
          topic:
            field: topics.points

    "3":
      model: Velodyne VLP-16
      label: Vertical VLP-16 LiDAR
      family: lidar
      expected_publisher: /sensors/lidar/vert/lidar_v_link_nodelet_manager
      dashboard_kind: pointcloud
      dashboard_mode: ROS point cloud
      startup_order: 30
      default_requested: true
      reachability: network
      endpoint_key: lidar_v_ip
      frame: lidar_v_link
      driver_name: vert
      port: 2369
      topics:
        points: /sensors/lidar/vert/points
      launch:
        file: package://ig_handle/launch/sensors/start_lidar.launch
        args:
          name:
            field: driver_name
          device_ip:
            endpoint: true
          port:
            field: port
          frame_id:

          camera_info_topic:
            field: topics.camera_info
          startup_delay_sec:
            field: startup_delay_sec

    "6":
      model: FLIR Forge
      label: Forge F3 camera
      family: camera
      expected_publisher: /F3/camera_nodelet_manager
      dashboard_kind: camera
